</div>

<div id="game">
  <div class="top"><div class="brand">GENERATIONS</div><div id="topstats" class="statsline"></div><div class="grow"></div><button id="names" title="Toggle English-friendly name spelling">🌐 NAMES</button><button id="save">SAVE</button><button id="new">NEW</button></div>
  <div class="main"><div id="world" class="world"></div><div class="side"><div class="tabs">
    <button data-tab="home">HOME</button><button data-tab="family">FAMILY</button><button data-tab="world">WORLD</button><button data-tab="life">LIFE</button><button data-tab="events" id="evtab">EVENTS</button><button data-tab="dating">DATING</button>
  </div><div id="content" class="content"></div></div></div>

</div>
<div id="modalRoot"></div>

<script>
(function(){

const $=id=>document.getElementById(id);
const SP=t=>[...new Set(t.split(", "))],CULTS=["EN","PL","RU"],CN={EN:"English",PL:"Polish",RU:"Russian"};
const NM={

const FR={Stanislaw:"Stanislav",Michal:"Michael",Mikhail:"Michael",Pawel:"Pavel",Lukasz:"Lukash",Rafal:"Rafael",Jozef:"Joseph",Aleksander:"Alexander",Aleksandr:"Alexander",Katarzyna:"Catherine",Malgorzata:"Margaret",Elzbieta:"Elizabeth",Wladyslaw:"Vladislav",Dmitri:"Dmitry",Alexei:"Alexey",Aleksey:"Alexey",Nikolai:"Nicholas",Fyodor:"Fedor",Yekaterina:"Ekaterina",Tatiana:"Tatyana",Yulia:"Julia",Aleksandra:"Alexandra"};
function strip(t){return t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ł/g,"l").replace(/Ł/g,"L")}
function maleSur(t){if(/(ova|eva|ina)$/.test(t)&&SN.RU.includes(t.slice(0,-1)))return t.slice(0,-1);if(/(ska|cka|zka)$/.test(t)){const m=t.slice(0,-1)+"i";if(SN.PL.includes(m))return m}return t}
function femSur(t){const m=maleSur(t);if(SN.RU.includes(m))return m+"a";if(SN.PL.includes(m)&&/(ski|cki|zki)$/.test(m))return m.slice(0,-1)+"a";return m}
function knownSur(t){return t.split("-").every(x=>CULTS.some(c=>SN[c].includes(maleSur(x))))}
function rndFirst(g,c){return pick(NM[CULTS.includes(c)?c:"EN"][g==="F"?"F":"M"])}
function rndSur(c,g){const t=pick(SN[CULTS.includes(c)?c:"EN"]);return g==="F"?femSur(t):t}
function applyName(p){const fr=typeof state!=="undefined"&&state&&state.friendly;p.first=fr?(FR[p.fn]||p.fn):p.fn;p.surname=fr?strip(p.sn):p.sn;p.name=p.first+" "+p.surname}
function fixName(p,keep){
 if(p.gender!=="M"&&p.gender!=="F")p.gender=pick(["M","F"]);
 if(!CULTS.includes(p.cult))p.cult=pick(["EN","EN","PL","RU","RU"]);
 if(keep){p.fn=p.fn||p.first||rndFirst(p.gender,p.cult);p.sn=p.sn||p.surname||rndSur(p.cult,p.gender)}
 else{if(!NM[p.cult][p.gender].includes(p.fn))p.fn=rndFirst(p.gender,p.cult);if(!p.sn||!knownSur(p.sn))p.sn=rndSur(p.cult,p.gender);else p.sn=p.sn.split("-").map(x=>p.gender==="F"?femSur(x):maleSur(x)).join("-")}
 applyName(p);
}
function weddingName(a,b){const w=a.gender==="F"?a:b,h=w===a?b:a;if(w===state.player||!w.sn||!h.sn)return;const r=Math.random(),hs=maleSur(h.sn.split("-")[0]);w.maiden=w.maiden||w.sn;
 if(r<.6)w.sn=femSur(hs);else if(r<.75&&w.cult!=="RU"&&!w.sn.includes("-")&&femSur(hs)!==w.sn)w.sn=w.sn+"-"+femSur(hs);applyName(w)}

const TRAITS=["kind","ambitious","funny","serious","shy","outgoing","stubborn","family-oriented","creative","practical","generous","independent"];
let state=null,tabName="home",pressed={};

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function person(g,age){
  const c=pick(["EN","EN","PL","RU","RU"]),p={id:uid(),gender:g==="F"?"F":"M",cult:c,fn:rndFirst(g,c),sn:rndSur(c,g),age,job:pick(JOBS),trait:pick(TRAITS),money:Math.round(500+Math.random()*5000),x:80+Math.random()*650,y:90+Math.random()*430,mem:[],parents:[],children:[],spouse:null,dating:null,alive:true,rel:{}};p.line=p.id;p.gen=1;

  {const c=pick(CULTS),g=pick(["M","F"]);$("cult").value=c;$("gender").value=g;$("first").value=rndFirst(g,c);$("surname").value=rndSur(c,g)}

  for(let i=0;i<5;i++){let v=30+Math.floor(Math.random()*71);$("stat"+i).value=v;$("val"+i).textContent=v}

function makeState(){
  const first=$("first").value.trim()||"Robert", surname=$("surname").value.trim()||"Smith";
  const p={id:uid(),first,surname,name:first+" "+surname,gender:$("gender").value,age:clamp(parseInt($("age").value)||22,18,65),job:$("job").value,trait:$("trait").value,money:2000,x:330,y:260,mem:["Started a new life in the town."],parents:[],children:[],spouse:null,alive:true,rel:{},education:$("education").value,stats:{},location:"home"};

  p.look=readLook();p.cult=$("cult").value;p.fn=first;{const m=maleSur(surname);p.sn=p.gender==="F"?femSur(m):m}fixName(p,true);const people=[p];
  return {year:2026,player:p,people,events:["2026 — "+p.name+" began a new life."],pending:null};

function workPlace(j){return ({Teacher:"school",Doctor:"hospital",Nurse:"hospital",Chef:"cafe","Shop worker":"shop","Business owner":"shop",Farmer:"park","Police officer":"street",Mechanic:"work","Office worker":"work",Engineer:"work",Programmer:"work",Writer:"cafe",Artist:"cafe"})[j]||"street"}
function sched(p,h,day){
 if(p.away)return "inhome";const d=day%7,wk=d<5,v=(p.h||(p.h=hsh(p.id)))%10;
 if(h>=22||h<7||p.age<5)return "inhome";
 if(p.age<18){if(wk&&h>=8&&h<15)return "school";return h>=15&&h<18?"park":"inhome"}
 if(d===6&&h>=10&&h<11&&(v<4||p.age>=65))return "church";
 if(p.age>=65)return h>=10&&h<12?"park":h>=15&&h<17?"cafe":"inhome";
 if(wk&&h>=9&&h<17)return(h===12&&v<4)?"cafe":workPlace(p.job);
 if(h>=17&&h<20)return(p.trait==="outgoing"||v<3)?"cafe":v<6?"park":"inhome";
 if(!wk&&h>=10&&h<18)return v<4?"park":v<7?"cafe":"inhome";
 return "inhome";
}
function nowH(){return Math.floor(state.clock/60)%24}
const BLD={home:[7,8,145,100],school:[73,9,145,100],hospital:[7,69,145,100],shop:[74,69,145,100],cafe:[43,4,105,72],work:[42,80,115,65],church:[25,34,125,68],cemetery:[72,35,145,68]};
let obK="",obL=[];
function WH(){return[Math.max(300,$("world").clientWidth),Math.max(250,$("world").clientHeight)]}
function OB(){const[W,H]=WH(),k=W+"x"+H;if(k!==obK){obK=k;obL=Object.values(BLD).map(b=>({l:b[0]*W/100,t:b[1]*H/100,r:b[0]*W/100+b[2],b:b[1]*H/100+b[3]}));obL.push({l:W*.97-190,t:H*.03,r:W*.97,b:H*.03+125})}return obL}
function blocked(x,y,pad){pad=pad==null?12:pad;const[W,H]=WH();if(!(x>=20&&x<=W-20&&y>=30&&y<=H-20))return true;return OB().some(r=>x>r.l-pad&&x<r.r+pad&&y>r.t-pad&&y<r.b+pad)}
function rndSpot(){const[W,H]=WH();for(let i=0;i<60;i++){const x=40+Math.random()*(W-80),y=60+Math.random()*(H-100);if(!blocked(x,y))return{x,y}}return{x:W*.48+30,y:H*.48+30}}
function safeSpot(x,y){if(!isFinite(x)||!isFinite(y))return rndSpot();if(!blocked(x,y))return{x,y};for(let r=12;r<=300;r+=12)for(let a=0;a<12;a++){const nx=x+Math.cos(a*Math.PI/6)*r,ny=y+Math.sin(a*Math.PI/6)*r;if(!blocked(nx,ny))return{x:nx,y:ny}}return rndSpot()}
function doorPos(pl){const[W,H]=WH(),b=BLD[pl];if(!b)return rndSpot();return safeSpot(b[0]*W/100+b[2]/2,b[1]*H/100+b[3]+16)}
function homePt(p){let s=hsh(String(p.id||"x"));const R=()=>(s=(s*1664525+1013904223)>>>0)/4294967296,[W,H]=WH();for(let i=0;i<40;i++){const x=30+R()*(W-60),y=40+R()*(H-70);if(!blocked(x,y))return{x,y}}return rndSpot()}
function spot(pl,p){if(pl==="inhome")return homePt(p||{});if(pl==="park"||pl==="street")return rndSpot();return doorPos(pl)}
function setDest(p,t){if(INDOOR.has(p.location)){const q=p.location==="inhome"?homePt(p):doorPos(p.location);p.x=q.x;p.y=q.y}const s=spot(t,p);p.dest=t;p.tx=s.x;p.ty=s.y;p.stuck=0;p.location="street"}
function fixOutdoor(){if(!state)return;for(const p of VIS){if(!p.alive)continue;if(OUT.includes(p.location)&&blocked(p.x,p.y,2)){const s=safeSpot(p.x,p.y);p.x=s.x;p.y=s.y}if(p.tx!=null&&blocked(p.tx,p.ty,2)){const s=safeSpot(p.tx,p.ty);p.tx=s.x;p.ty=s.y}}}
function ensureSched(){if(state.clock==null)state.clock=480;state.hr=nowH();const day=Math.floor(state.clock/1440);
 for(const p of state.people){if(p===state.player||!p.alive||p.sch)continue;p.sch=1;p.location=where(p,state.hr,day)}}
function tick(){
 if(!state||state.ended||$("game").style.display==="none"||modalOpen())return;
 state.clock+=10;const h=nowH(),day=Math.floor(state.clock/1440);if(state.lastYD==null)state.lastYD=day;if(day-state.lastYD>=30){advanceYear();return}
 if(h!==state.hr){state.hr=h;hourUpdate(h,day);renderWorld()}
 VIS.forEach(p=>{if(p.alive&&!p.exit&&p.tx==null&&!INDOOR.has(p.location)&&p.location!=="cemetery"&&Math.random()<.2){const[W,H]=WH(),s=safeSpot(clamp(p.x+(Math.random()-.5)*120,30,W-30),clamp(p.y+(Math.random()-.5)*100,40,H-30));p.tx=s.x;p.ty=s.y}});
 $("clock").textContent=DAYS[day%7]+" "+String(h).padStart(2,"0")+":"+String(state.clock%60).padStart(2,"0")+" · "+state.year;
}
function moveEl(p){const e=$("person-"+p.id);if(e){e.style.left=p.x+"px";e.style.top=p.y+"px"}}
function walkNPCs(){
 if(!state||state.ended||$("game").style.display==="none"||modalOpen())return;
 for(const p of VIS){
  if(!p.alive||p.tx==null)continue;
  const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
  if(!(d>=3)||(p.stuck||0)>60){
   p.stuck=0;if(d>=3){p.x=p.tx;p.y=p.ty}p.tx=null;if(p.exit){unspawn(p);continue}
   if(p.dest){const loc=p.dest;p.location=loc;p.dest=null;
    if(INDOOR.has(loc)){VIS.delete(p);p.vis=0;ROSTER.key="";const e=$("person-"+p.id);if(e)e.remove();if(state.inside&&(state.inside===loc||(state.inside==="home"&&loc==="inhome")))renderWorld()}
    else if(!state.inside)moveEl(p)}
   continue}
  const sx=dx/d*1.4,sy=dy/d*1.4,stuckNow=blocked(p.x,p.y,6);let moved=false;
  if(stuckNow||!blocked(p.x+sx,p.y,6)){p.x+=sx;moved=true}
  if(stuckNow||!blocked(p.x,p.y+sy,6)){p.y+=sy;moved=true}
  p.stuck=moved?0:(p.stuck||0)+1;
  if(!state.inside)moveEl(p);
 }
}

function emigrate(k){if(k<=0)return;const P=state.pop,me=state.player,A=YR.adults;let gone=0,guard=0;
 while(gone<k&&guard++<80&&A.length){const p=A[Math.floor(Math.random()*A.length)];if(!p.alive||p.away||p===me||p.age<20||p.age>58||(CIRC&&CIRC.has(p.id)))continue;
  const sp=p.spouse&&find(p.spouse),grp=[p];if(sp&&sp.alive&&!sp.away)grp.push(sp);(p.children||[]).forEach(i=>{const c=find(i);if(c&&c.alive&&c.age<18&&!c.away)grp.push(c)});
  if(grp.some(x=>x===me||(CIRC&&CIRC.has(x.id))))continue;grp.forEach(x=>{setAway(x);x.gone=true});gone+=grp.length;
  chron("The "+maleSur((p.sn||p.surname||"").split("-")[0])+" household left town to seek work elsewhere.",p)}
 P.left+=gone}
function pruneDead(){const me=state.player,keep=new Set(),best=new Map();
 for(const x of state.people){if(!x.alive)continue;let fr=(x.parents||[]).slice(),d=6;
  while(fr.length&&d>0){const nx=[];for(const i of fr){if((best.get(i)||0)>=d)continue;best.set(i,d);keep.add(i);const q=find(i);if(q)(q.parents||[]).forEach(j=>nx.push(j))}fr=nx;d--}}
 /* the whole dynasty (every descendant of the player's line) stays on record forever */
 const seeds=state.people.filter(x=>x.line===me.line||x===me),seen=new Set();let q=seeds.slice();
 while(q.length){const c=q.pop();if(seen.has(c.id))continue;seen.add(c.id);keep.add(c.id);(c.children||[]).forEach(i=>{const k=find(i);if(k)q.push(k)})}
 const before=state.people.length;
 state.people=state.people.filter(x=>x.alive||x===me||keep.has(x.id)||x.line===me.line||x.died==null||state.year-x.died<30);
 state.people.forEach(x=>{if(!x.alive&&x.died!=null&&state.year-x.died>=15){x.mem=(x.mem||[]).slice(-2);x.rel={};delete x.look;delete x.stats}});
 if(state.people.length!==before)IDXs=null}
function worldYear(){const P=state.pop||(state.pop=newPop()),me=state.player;
 P.trend=clamp((P.trend||0)*.75+(Math.random()-.5)*.035,-.04,.04);
 P.target=Math.round(clamp(P.target*(1+P.trend)+(POP.base-P.target)*.02,POP.min,POP.max));
 const live=state.people.filter(x=>x.alive&&!x.away),n=live.length,T=P.target,gap=T-n;
 festival(live);
 /* the town only draws people in when it is below what it can sustain — deaths are NOT replaced one-for-one */
 let want=gap>0?gap*.07+T*.003:(n<T*1.12?T*.0012:0);want=Math.round(want*(.6+Math.random()*.8));
 const b0=state.people.length;let guard=0;while(state.people.length-b0<want&&guard++<300)immigrate();
 const singles=live.filter(x=>adult(x)&&x.age<45&&!x.spouse&&!x.dating&&x!==me).length;
 if(singles<n*.05&&n<T*1.15)for(let i=0;i<3;i++)immigrate("worker");
 P.arr+=state.people.length-b0;
 if(n>T*1.08)emigrate(Math.round((n-T*1.05)*.1));
 if(state.year%5===0)pruneDead();
 const now=state.people.filter(x=>x.alive&&!x.away).length;
 P.last={born:P.born,died:P.died,arr:P.arr,left:P.left};P.born=P.died=P.arr=P.left=0;
 (P.hist=P.hist||[]).push({y:state.year,n:now});if(P.hist.length>80)P.hist=P.hist.slice(-80);
 CIRC=null}
function popCard(){const P=state.pop||(state.pop=newPop()),live=state.people.filter(p=>p.alive),res=live.filter(p=>!p.away).length,vis=VIS.size,L=P.last||{born:0,died:0,arr:0,left:0},H=(P.hist||[]).slice(-60);let spark="";
 if(H.length>1){const mn=Math.min(...H.map(x=>x.n)),mx=Math.max(...H.map(x=>x.n)),rg=Math.max(1,mx-mn);
  spark='<svg viewBox="0 0 240 44" style="width:100%;height:44px;margin-top:6px"><polyline fill="none" stroke="#d19a3e" stroke-width="2" points="'+H.map((x,i)=>(i*240/(H.length-1)).toFixed(1)+","+(40-(x.n-mn)/rg*36).toFixed(1)).join(" ")+'"/></svg><div class="muted" style="font-size:11px">Residents '+H[0].y+' → '+H[H.length-1].y+'</div>'}
 return'<div class="card"><h3>Population</h3><div class="row"><span>Residents</span><b>'+res+'</b></div><div class="row"><span>Seen on the map now</span><b>'+vis+'</b></div><div class="row"><span>Living in the background</span><b>'+Math.max(0,res-vis)+'</b></div><div class="row"><span>Town can sustain (drifts)</span><b>~'+P.target+'</b></div><div class="row"><span>Away in other towns</span><b>'+(live.length-res)+'</b></div><div class="row"><span>Last year</span><b>+'+L.born+' born · '+L.died+' died · +'+L.arr+' arrived · −'+L.left+' left</b></div>'+spark+'</div>'}
function gazetteCard(){return'<div class="card"><h3>Town gazette</h3>'+((state.gaz||[]).slice(-8).reverse().map(e=>'<div class="event">'+esc(e)+'</div>').join("")||'<span class="muted">Quiet so far.</span>')+'</div>'}
function datingPool(me){const pre=state.people.filter(x=>x.alive&&x!==me&&adult(x)&&!x.away).sort((a,b)=>relation(b.id)-relation(a.id)||Math.abs(a.age-me.age)-Math.abs(b.age-me.age)),out=[];
 for(const x of pre){if(out.length>=15)break;if(!kin(x,me))out.push(x)}return out}
function seedElders(k){for(let i=0;i<k;i++){const c=pick(CULTS),ha=62+Math.floor(Math.random()*24),wa=clamp(ha-4+Math.floor(Math.random()*9),60,90),h=mkP("M",ha,c),w=mkP("F",wa,c);
 h.job=w.job="Retired";w.maiden=w.sn;h.spouse=w.id;w.spouse=h.id;h.addr=w.addr=addr();state.people.push(h,w);weddingName(h,w);
 const n=Math.floor(Math.random()*3);for(let j=0;j<n;j++){const g=pick(["M","F"]),a=clamp(wa-24-Math.floor(Math.random()*12),20,58),kd=makeChild(h,w,rndFirst(g,c),g);kd.age=a;kd.job=pick(JOBS);kd.addr=Math.random()<.5?nearAddr(h.addr):addr();h.children.push(kd.id);w.children.push(kd.id);state.people.push(kd)}}}
function packState(){const DROP=new Set(["x","y","tx","ty","dest","stuck","sch","ix","iy","vis","exit","look","h"]),pl=state.player,
 /* the dead keep only what the family tree, cemetery and kinship checks need */
 GRAVE=new Set(["id","name","first","surname","fn","sn","maiden","gender","age","died","job","trait","education","parents","children","spouse","line","gen","alive","cult","origin","addr"]);
 return JSON.stringify(state,function(k,v){if(this&&this.gender&&this!==pl){if(this.alive===false){if(k!==""&&!GRAVE.has(k))return undefined}else if(DROP.has(k))return undefined}return v})}
function trimForSave(){state.people.forEach(p=>{if(p===state.player)return;p.mem=(p.mem||[]).slice(p.alive?-4:-1);const ks=Object.keys(p.rel||{});if(ks.length>6){const o={};ks.sort((a,b)=>Math.abs(p.rel[b])-Math.abs(p.rel[a])).slice(0,6).forEach(k=>o[k]=p.rel[k]);p.rel=o}});state.events=state.events.slice(-120);state.gaz=(state.gaz||[]).slice(-40)}
window.GENDEBUG={
 stats(){const live=state.people.filter(x=>x.alive),res=live.filter(x=>!x.away).length;return{total:state.people.length,living:live.length,residents:res,visible:VIS.size,background:res-VIS.size,target:state.pop.target,year:state.year,saveKB:Math.round(packState().length/1024)}},
 stress(n){let g=0;while(state.people.filter(x=>x.alive&&!x.away).length<n&&g++<4000)foundFamily();state.pop.target=Math.max(state.pop.target,n);state.people.forEach(p=>{p.sch=0});IDXs=null;render();return this.stats()},
 years(k){const t=performance.now();for(let i=0;i<k;i++)advanceYear();return{ms:Math.round(performance.now()-t),stats:this.stats()}}};

fillCreator();initLook();document.body.insertAdjacentHTML("beforeend",'<div id="clock" style="position:fixed;right:10px;bottom:8px;background:#000a;color:#fff;padding:4px 10px;border-radius:6px;font:13px monospace;z-index:5"></div>');document.body.insertAdjacentHTML("beforeend",'<div id="hint"></div>');setInterval(move,30);setInterval(walkNPCs,30);setInterval(tick,1000);setInterval(()=>{const h=$("hint");if(!state||$("game").style.display==="none"||modalOpen()){h.style.display="none";return}const t=target();h.style.display=t?"block":"none";if(t)h.textContent="E — "+t.l},150);window.addEventListener("resize",()=>{if(state&&$("game").style.display!=="none")renderWorld()});
window.addEventListener("error",e=>{if($("game").style.display!=="none")status("Game error: "+e.message);});
if(localStorage.getItem("GENERATIONS_SAVE")){$("creatorMsg").innerHTML='<div style="margin-top:12px"><button id="load">↩ LOAD SAVED DYNASTY</button></div>';$("load").onclick=loadSaved;}
})();
